<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; font-family: "Segoe UI", system-ui, sans-serif; }
  a { font-size: 20px; padding: 14px 32px; border-radius: 6px; background: #0f4c75; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<!-- The page sends ?app=<key> to that app's Teams link (D94);
the Stageview route of 22 Oct is retired. -->
<a id="open" href=""></a>
<script>
(async () => {
  const key = new URLSearchParams(location.search).get("app");
  const app = (await (await fetch("apps.json", { cache: "no-store" })).json())[key];
  const link = document.getElementById("open");
  link.textContent = app.name;
  link.href = app.teamsLink;
  location.replace(app.teamsLink);
})();
</script>
</body>
</html>
