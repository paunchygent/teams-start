<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; font-family: "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; font-size: 20px; padding: 14px 32px; border: 0; border-radius: 6px; background: #5B2A86; color: #fff; cursor: pointer; }
  button[hidden] { display: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/teams-js@2.57.0/dist/umd/MicrosoftTeams.min.js"></script>
</head>
<body>
<button id="open" hidden></button>
<script>
// Teams start page: opens a Power Apps app in Teams Stageview instead of the tab's main slot, where
// Teams' memory audit removes apps during the player's load burst. ?app=<key> selects an entry in apps.json.
(async () => {
  const key = new URLSearchParams(location.search).get("app");
  const app = (await (await fetch("apps.json", { cache: "no-store" })).json())[key];
  const context = { appId: app.teamsAppId, contentUrl: app.playerUrl, websiteUrl: app.playerUrl, name: app.name, openMode: app.openMode };
  const link = `https://teams.microsoft.com/l/stage/${app.teamsAppId}/0?context=${encodeURIComponent(JSON.stringify(context))}`;
  const button = document.getElementById("open");
  button.textContent = app.name;
  button.hidden = false;
  // A Website tab gives the page no Teams context, so initialize never resolves there; the plain link
  // (target from ?target=, default _top) then lets Teams handle the stage deep link itself.
  const target = new URLSearchParams(location.search).get("target") || "_top";
  button.onclick = () => window.open(link, target);
  const teams = await Promise.race([microsoftTeams.app.initialize().then(() => true), new Promise((r) => setTimeout(() => r(false), 3000))]);
  if (!teams) return;
  microsoftTeams.app.notifySuccess();
  const open = () => microsoftTeams.app.openLink(link).catch((e) => console.error("openLink", e));
  button.onclick = open;
  open();
})();
</script>
</body>
</html>
